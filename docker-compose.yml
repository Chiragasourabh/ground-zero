services:
  vessel-map:
    build: .
    image: vessel-map
    ports:
      - "8501:8501"
    environment:
      - CSV_PATH=/app/data/ship_to_daftvalues.csv
    restart: unless-stopped

  # One-off job: docker compose run --rm --build preprocess
  preprocess:
    build: .
    image: vessel-map
    profiles: ["tools"]
    command: python preprocess_bathy.py
    volumes:
      - ./data:/app/data
    environment:
      - BATHY_PATH=/app/data/bathymetry.csv
      - BATHY_SEP=,          # use a tab character if your file is tab-separated
      - GRID_DEG=0.002       # UKC grid cell (~200 m). Smaller = more detail, bigger files
      - CELL_DEG=0.005       # contour smoothing cell (~500 m)
      - CONTOUR_STEP=5       # metres between contour lines
