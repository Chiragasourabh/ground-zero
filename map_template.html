<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0D2B45; --paper:#F3F7F9; --rule:#C9D6DF; --sea:#2E6F95; }
  html, body, #map { margin:0; height:100%; width:100%; }
  body, .leaflet-container { font-family: Barlow, "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink); }
  .leaflet-container { background:#DCE8EE; }
  .ukc-img { image-rendering: pixelated; image-rendering: crisp-edges; }

  .panel { position:absolute; z-index:1000; background:var(--paper); border:1px solid var(--rule);
           border-radius:6px; box-shadow:0 2px 10px rgba(13,43,69,.18); }

  /* Ship readout: the one bold element */
  #readout { top:12px; left:12px; padding:10px 14px 12px; min-width:220px; border-left:6px solid var(--cat,#9E9E9E); }
  #readout .ship { font-size:13px; font-weight:500; color:var(--sea); }
  #readout .big  { font-size:34px; font-weight:600; line-height:1.05; margin:2px 0; font-variant-numeric:tabular-nums; }
  #readout .cat  { font-size:15px; font-weight:600; }
  #readout .sub  { font-size:12.5px; margin-top:6px; line-height:1.45; color:#3C566B; font-variant-numeric:tabular-nums; }

  #legend { bottom:28px; right:12px; padding:10px 12px; width:250px; font-size:12.5px; }
  #legend .title { font-weight:600; font-size:13.5px; margin-bottom:6px; }
  .row { display:grid; grid-template-columns:14px 1fr 64px 40px; align-items:center; gap:8px; margin:4px 0; }
  .sw  { width:14px; height:14px; border-radius:3px; }
  .rng { color:#5B7385; font-size:11.5px; }
  .bar { height:6px; background:#E2EAF0; border-radius:3px; overflow:hidden; }
  .bar > div { height:100%; }
  .pct { text-align:right; font-variant-numeric:tabular-nums; }
  #legend .foot { margin-top:6px; color:#5B7385; font-size:11.5px; }

  .leaflet-tooltip { font-family:inherit; font-size:12.5px; color:var(--ink); line-height:1.45; }
  .leaflet-tooltip b { font-weight:600; }
  .tag { display:inline-flex; align-items:center; gap:6px; font-weight:600; margin-top:2px; }
  .tag i { width:11px; height:11px; border-radius:2px; display:inline-block; }
</style>
</head>
<body>
<div id="map"></div>
<div id="readout" class="panel"></div>
<div id="legend" class="panel"></div>
<script>
const D = __DATA__;

function catOf(u) {
  if (u === null || isNaN(u)) return null;
  return D.categories.find(c => u >= c.lo && u < c.hi) || null;
}
const tag = (color, name) => `<span class="tag"><i style="background:${color}"></i>${name}</span>`;
const fmt = (v, d = 1) => (v === null || v === undefined || isNaN(v)) ? "n/a" : Number(v).toFixed(d);
const ll = (lon, lat) => L.latLng(lat, lon);
const bbox = b => L.latLngBounds(ll(b[0][0], b[0][1]), ll(b[1][0], b[1][1]));

// ---------- Readout ----------
(function () {
  const r = D.readout, el = document.getElementById("readout");
  if (!r) { el.style.display = "none"; return; }
  el.style.setProperty("--cat", r.color);
  el.innerHTML = `
    <div class="ship">Ship ${r.ship}</div>
    <div class="big">${r.ukc === null ? "n/a" : fmt(r.ukc, 0) + "%"}</div>
    <div class="cat">${r.category}</div>
    <div class="sub">Under-keel clearance at ship position<br>
      Water depth h ${fmt(r.h)} m, draft T ${fmt(r.teff, 2)} m</div>`;
})();

// ---------- Legend ----------
(function () {
  const el = document.getElementById("legend");
  if (!D.showUkc || !D.stats) { el.style.display = "none"; return; }
  const rows = D.categories.slice().reverse().map(c => {
    const p = D.stats[c.name] || 0;
    return `<div class="row"><div class="sw" style="background:${c.color}"></div>
      <div>${c.name}<div class="rng">${c.range}</div></div>
      <div class="bar"><div style="width:${p}%;background:${c.color}"></div></div>
      <div class="pct">${fmt(p, 0)}%</div></div>`;
  }).join("");
  el.innerHTML = `<div class="title">UKC within analysis area</div>${rows}
    <div class="foot">Share of wet area inside the dashed box${D.stride > 1 ? `, sampled every ${D.stride} cells` : ""}.</div>`;
})();

// ---------- Map, locked to the data area ----------
const limit = bbox(D.maxBounds);
const map = L.map("map", { zoomControl: false, preferCanvas: true, zoomSnap: 0.25,
                           maxBounds: limit, maxBoundsViscosity: 1.0 });
L.control.zoom({ position: "topright" }).addTo(map);
L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(map);

// Keep the user's pan/zoom across reruns (window.name survives the page reload), unless the area changed
let restored = false;
try {
  const v = JSON.parse(window.name || "null");
  if (v && v.key === D.viewKey) { map.setView(v.center, v.zoom, { animate: false }); restored = true; }
} catch (e) {}
if (!restored) map.fitBounds(bbox(D.fitBounds), { padding: [60, 60], animate: false });
map.setMinZoom(Math.max(0, map.getBoundsZoom(limit, true) - 0.25));  // can't zoom out past the boundary
map.on("moveend", () => {
  try { window.name = JSON.stringify({ key: D.viewKey, center: map.getCenter(), zoom: map.getZoom() }); } catch (e) {}
});

// ---------- Layers ----------
if (D.showUkc && D.image) {
  const c = D.image.coords;  // [[w,n],[e,n],[e,s],[w,s]]
  L.imageOverlay(D.image.url, L.latLngBounds(ll(c[3][0], c[3][1]), ll(c[1][0], c[1][1])),
    { opacity: D.opacity, className: "ukc-img", interactive: false }).addTo(map);
}

let overFeature = false;
const flag = (layer) => layer.on({ mouseover: () => { overFeature = true; gridTip.remove(); },
                                   mouseout: () => { overFeature = false; } });

if (D.contours) {
  flag(L.geoJSON(D.contours, {
    style: f => ({ color: f.properties.color, weight: 1.2, opacity: 0.85 }),
    onEachFeature: (f, layer) => layer.bindTooltip(
      `<b>Depth contour:</b> ${fmt(f.properties.depth)} m below datum`, { sticky: true }),
  }).addTo(map));
}

if (D.aoi) {
  L.geoJSON(D.aoi, { interactive: false,
    style: { color: "#0D2B45", weight: 1.5, dashArray: "6 4", fill: false } }).addTo(map);
}

map.createPane("ships").style.zIndex = 450;
const shipRenderer = L.canvas({ pane: "ships" });
function shipHtml(p) {
  return `<b>id_ano:</b> ${p.id}<br><b>Statut de navigation:</b> ${p.statut}<br>
    <b>Tirant d'eau:</b> ${fmt(p.draft, 2)} m<br><b>Water depth h:</b> ${fmt(p.h)} m<br>
    <b>UKC:</b> ${p.ukc === null ? "n/a" : fmt(p.ukc, 0) + "%"}<br>
    ${tag(p.color, p.category)}`;
}
if (D.ships) {
  flag(L.geoJSON(D.ships, {
    pointToLayer: (f, latlng) => {
      const s = f.properties.selected;
      return L.circleMarker(latlng, { renderer: shipRenderer, pane: "ships",
        radius: s ? 9 : 5, fillColor: f.properties.color, fillOpacity: 1,
        color: s ? "#0D2B45" : "#FFFFFF", weight: s ? 3 : 1.2 });
    },
    onEachFeature: (f, layer) => layer.bindTooltip(shipHtml(f.properties), { direction: "top", offset: [0, -6] }),
  }).addTo(map));
}

// ---------- Hover over the UKC grid ----------
const gridTip = L.tooltip({ direction: "top", offset: [0, -8] });
map.on("mousemove", (e) => {
  const g = D.hover;
  if (!g || overFeature) return;
  const ix = Math.floor((e.latlng.lng - g.w) / g.cell), iy = Math.floor((e.latlng.lat - g.s) / g.cell);
  const h = (ix >= 0 && iy >= 0 && ix < g.nx && iy < g.ny) ? g.h[iy * g.nx + ix] : null;
  if (h === null) { gridTip.remove(); return; }
  let html;
  if (h <= 0) html = `<b>Dry at this water level</b><br>h ${fmt(h)} m`;
  else {
    const u = (h - D.teff) / D.teff * 100, c = catOf(u);
    html = `<b>Water depth h:</b> ${fmt(h)} m<br><b>UKC:</b> ${fmt(u, 0)}%<br>
      ${c ? tag(c.color, c.name) : ""}`;
  }
  gridTip.setLatLng(e.latlng).setContent(html);
  if (!map.hasLayer(gridTip)) gridTip.openOn(map);
});
map.on("mouseout", () => gridTip.remove());
</script>
</body>
</html>
